      OWN-WORLD: Blue-black wet-asphalt ground with pink and sodium-amber spill; milky acrylic lightboxes lettered in signage red, jade and ink; a pink tube around the table, an amber tube for whose turn; heavy Hei lettering, DIN numerals; clay chips; white cards.
      STORY: A friend opens the file, sits under their own lightbox, and always knows whose turn it is because only that tube is lit; at the end the ledger settles the night.
      FIRST VIEWPORT: Lobby: a pink neon sign beside red/jade shopfront signboards (create / join). Table: pill table ringed by a pink tube, seats as lightboxes, amber neon pot above the board, action signboards in the bottom bar.
